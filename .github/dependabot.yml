# Actions only. Python packages stay pinned to the versions the published
# results were measured with; Dependabot security alerts still cover them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
