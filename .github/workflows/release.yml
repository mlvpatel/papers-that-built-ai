name: release

# Push an annotated tag like v1.0.0 on main; the tag's message becomes the release notes.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
      id-token: write # get a short-lived Sigstore certificate to sign the provenance
      attestations: write # store the provenance attestation on GitHub
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack the tagged source
        env:
          TAG: ${{ github.ref_name }}
        run: git archive --format=tar.gz --prefix="papers-that-built-ai-${TAG}/" -o "papers-that-built-ai-${TAG}.tar.gz" HEAD
      - name: Record signed build provenance for the archive
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: papers-that-built-ai-${{ github.ref_name }}.tar.gz
      - name: Publish the release with the archive and its provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "papers-that-built-ai-${TAG}.tar.gz.sigstore.json"
          gh release create "$TAG" --verify-tag --notes-from-tag --title "$TAG" \
            "papers-that-built-ai-${TAG}.tar.gz" \
            "papers-that-built-ai-${TAG}.tar.gz.sigstore.json"
